name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check tag matches package version
        run: test "v$(node -p "require('./projects/ngx-seo-meta/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npx ng lint
      - run: npx ng test ngx-seo-meta --watch=false
      - run: npx ng build ngx-seo-meta
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; provenance is generated automatically.
      - run: npm install -g npm@latest
      - run: npm publish --access public
        working-directory: dist/ngx-seo-meta
